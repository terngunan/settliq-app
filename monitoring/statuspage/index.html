<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settliq Status</title>
  <meta name="description" content="Real-time status of Settliq platform components" />
  <style>
    :root {
      --green:  #22c55e;
      --yellow: #f59e0b;
      --red:    #ef4444;
      --gray:   #6b7280;
      --bg:     #0f172a;
      --surface:#1e293b;
      --border: #334155;
      --text:   #f1f5f9;
      --muted:  #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 720px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo span { color: var(--green); }

    .overall-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      border: 1px solid transparent;
      transition: background 0.3s, color 0.3s;
    }

    .overall-badge.healthy  { background: rgba(34,197,94,0.15);  color: var(--green);  border-color: rgba(34,197,94,0.3); }
    .overall-badge.degraded { background: rgba(245,158,11,0.15); color: var(--yellow); border-color: rgba(245,158,11,0.3); }
    .overall-badge.down     { background: rgba(239,68,68,0.15);  color: var(--red);    border-color: rgba(239,68,68,0.3); }
    .overall-badge.loading  { background: rgba(107,114,128,0.15);color: var(--muted);  border-color: rgba(107,114,128,0.3); }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .dot.pulse { animation: pulse 2s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .components-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .component-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .component-row:last-child { border-bottom: none; }
    .component-row:hover { background: rgba(255,255,255,0.03); }

    .component-name {
      font-size: 0.9375rem;
      font-weight: 500;
    }

    .component-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .component-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8125rem;
      font-weight: 600;
    }

    .status-ok       { color: var(--green); }
    .status-degraded { color: var(--yellow); }
    .status-down     { color: var(--red); }
    .status-unknown  { color: var(--muted); }

    .status-indicator {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-indicator.ok       { background: var(--green); }
    .status-indicator.degraded { background: var(--yellow); animation: pulse 2s infinite; }
    .status-indicator.down     { background: var(--red);    animation: pulse 1s infinite; }
    .status-indicator.unknown  { background: var(--muted); }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8125rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .refresh-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8125rem;
      transition: border-color 0.15s, color 0.15s;
    }

    .refresh-btn:hover { border-color: var(--text); color: var(--text); }

    .incident-banner {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 2rem;
      display: none;
    }

    .incident-banner.visible { display: block; }

    .incident-banner h3 {
      color: var(--red);
      font-size: 0.9375rem;
      margin-bottom: 0.25rem;
    }

    .incident-banner p {
      color: var(--muted);
      font-size: 0.8125rem;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8125rem;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); }

    .skeleton {
      background: linear-gradient(90deg, var(--border) 25%, var(--surface) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
      height: 14px;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>

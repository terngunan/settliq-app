<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settliq Status</title>
  <meta name="description" content="Real-time status of Settliq platform components" />
  <style>
    :root {
      --green:  #22c55e;
      --yellow: #f59e0b;
      --red:    #ef4444;
      --gray:   #6b7280;
      --bg:     #0f172a;
      --surface:#1e293b;
      --border: #334155;
      --text:   #f1f5f9;
      --muted:  #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 720px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo span { color: var(--green); }

    .overall-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      border: 1px solid transparent;
      transition: background 0.3s, color 0.3s;
    }

    .overall-badge.healthy  { background: rgba(34,197,94,0.15);  color: var(--green);  border-color: rgba(34,197,94,0.3); }
    .overall-badge.degraded { background: rgba(245,158,11,0.15); color: var(--yellow); border-color: rgba(245,158,11,0.3); }
    .overall-badge.down     { background: rgba(239,68,68,0.15);  color: var(--red);    border-color: rgba(239,68,68,0.3); }
    .overall-badge.loading  { background: rgba(107,114,128,0.15);color: var(--muted);  border-color: rgba(107,114,128,0.3); }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .dot.pulse { animation: pulse 2s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .components-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .component-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .component-row:last-child { border-bottom: none; }
    .component-row:hover { background: rgba(255,255,255,0.03); }

    .component-name {
      font-size: 0.9375rem;
      font-weight: 500;
    }

    .component-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .component-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8125rem;
      font-weight: 600;
    }

    .status-ok       { color: var(--green); }
    .status-degraded { color: var(--yellow); }
    .status-down     { color: var(--red); }
    .status-unknown  { color: var(--muted); }

    .status-indicator {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-indicator.ok       { background: var(--green); }
    .status-indicator.degraded { background: var(--yellow); animation: pulse 2s infinite; }
    .status-indicator.down     { background: var(--red);    animation: pulse 1s infinite; }
    .status-indicator.unknown  { background: var(--muted); }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8125rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .refresh-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8125rem;
      transition: border-color 0.15s, color 0.15s;
    }

    .refresh-btn:hover { border-color: var(--text); color: var(--text); }

    .incident-banner {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 2rem;
      display: none;
    }

    .incident-banner.visible { display: block; }

    .incident-banner h3 {
      color: var(--red);
      font-size: 0.9375rem;
      margin-bottom: 0.25rem;
    }

    .incident-banner p {
      color: var(--muted);
      font-size: 0.8125rem;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8125rem;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); }

    .skeleton {
      background: linear-gradient(90deg, var(--border) 25%, var(--surface) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
      height: 14px;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Cheese<span>Pay</span> Status</div>
      <div id="overall-badge" class="overall-badge loading">
        <span class="dot pulse"></span>
        <span id="overall-text">Checking…</span>
      </div>
    </header>

    <div id="incident-banner" class="incident-banner">
      <h3>⚠️ Active Incident</h3>
      <p id="incident-text"></p>
    </div>

    <p class="section-title">Components</p>

    <div class="components-card" id="components-card">
      <!-- Skeleton rows while loading -->
      <div class="component-row">
        <div><div class="skeleton" style="width:140px"></div></div>
        <div class="skeleton" style="width:60px"></div>
      </div>
      <div class="component-row">
        <div><div class="skeleton" style="width:100px"></div></div>
        <div class="skeleton" style="width:60px"></div>
      </div>
      <div class="component-row">
        <div><div class="skeleton" style="width:120px"></div></div>
        <div class="skeleton" style="width:60px"></div>
      </div>
      <div class="component-row">
        <div><div class="skeleton" style="width:80px"></div></div>
        <div class="skeleton" style="width:60px"></div>
      </div>
      <div class="component-row">
        <div><div class="skeleton" style="width:110px"></div></div>
        <div class="skeleton" style="width:60px"></div>
      </div>
    </div>

    <div class="meta-row">
      <span id="last-updated">Last checked: —</span>
      <button class="refresh-btn" onclick="fetchStatus()">↻ Refresh</button>
    </div>

    <footer>
      <p>
        <a href="https://settliq.xyz">settliq.xyz</a> ·
        <a href="mailto:support@settliq.xyz">support@settliq.xyz</a>
      </p>
      <p style="margin-top:0.5rem">Auto-refreshes every 60 seconds</p>
    </footer>
  </div>

  <script>
    // ─── Config ────────────────────────────────────────────────────────────────
    // In production this is served by the Cloudflare Worker which proxies
    // /health/admin and injects the response. For direct hosting, set this to
    // your API base URL (must have CORS enabled for status.settliq.xyz).
    const API_BASE = window.__API_BASE__ || 'https://api.settliq.xyz';
    const POLL_INTERVAL_MS = 60_000;

    // ─── Component display config ──────────────────────────────────────────────
    const COMPONENT_META = {
      database:   { label: 'Database',         description: 'Primary PostgreSQL cluster' },
      redis:      { label: 'Cache',            description: 'Redis cache layer' },
      api:        { label: 'API',              description: 'REST API gateway' },
      worker:     { label: 'Background Jobs',  description: 'Async job processing' },
      storage:    { label: 'Object Storage',   description: 'File & asset storage' },
    };

    // ─── Status helpers ────────────────────────────────────────────────────────
    function statusLabel(s) {
      return { ok: 'Operational', healthy: 'Operational', degraded: 'Degraded', down: 'Outage' }[s] ?? 'Unknown';
    }
    function statusClass(s) {
      return { ok: 'ok', healthy: 'ok', degraded: 'degraded', down: 'down' }[s] ?? 'unknown';
    }

    // ─── Rendering ─────────────────────────────────────────────────────────────
    function renderComponents(components) {
      const card = document.getElementById('components-card');
      const entries = Object.entries(components || {});

      if (entries.length === 0) {
        card.innerHTML = '<div class="component-row"><span class="component-name">No components reported</span></div>';
        return;
      }

      card.innerHTML = entries.map(([key, comp]) => {
        const meta = COMPONENT_META[key] || { label: key, description: '' };
        const cls = statusClass(comp.status);
        const label = statusLabel(comp.status);
        const latency = comp.latencyMs != null ? `${comp.latencyMs}ms` : '';
        return `
          <div class="component-row">
            <div>
              <div class="component-name">${meta.label}</div>
              ${meta.description ? `<div class="component-meta">${meta.description}</div>` : ''}
            </div>
            <div class="component-status status-${cls}">
              <span class="status-indicator ${cls}"></span>
              <span>${label}${latency ? ` · ${latency}` : ''}</span>
            </div>
          </div>`;
      }).join('');
    }

    function renderOverall(overall) {
      const badge = document.getElementById('overall-badge');
      const text = document.getElementById('overall-text');
      const cls = statusClass(overall);
      badge.className = `overall-badge ${cls === 'ok' ? 'healthy' : cls}`;
      text.textContent = statusLabel(overall);
    }

    function renderIncident(incident) {
      const banner = document.getElementById('incident-banner');
      const text = document.getElementById('incident-text');
      if (incident && incident.message) {
        text.textContent = incident.message;
        banner.classList.add('visible');
      } else {
        banner.classList.remove('visible');
      }
    }

    // ─── Data fetching ─────────────────────────────────────────────────────────
    async function fetchStatus() {
      try {
        const res = await fetch(`${API_BASE}/health/admin`, { headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        renderComponents(data.components);
        renderOverall(data.status || data.overall);
        renderIncident(data.incident);

        document.getElementById('last-updated').textContent =
          `Last checked: ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        renderOverall('down');
        document.getElementById('last-updated').textContent =
          `Last checked: ${new Date().toLocaleTimeString()} (error)`;
      }
    }

    fetchStatus();
    setInterval(fetchStatus, POLL_INTERVAL_MS);
  </script>
</body>
</html>

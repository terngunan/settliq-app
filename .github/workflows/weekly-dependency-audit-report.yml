name: Weekly Dependency Audit Report

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  dependency-audit-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --no-frozen-lockfile

      - name: Generate backend audit report
        working-directory: backend
        run: pnpm audit --audit-level=high 2>&1 | tee ../backend-audit-report.txt || true

      - name: Generate Rust contracts audit report
        working-directory: settliq_contracts
        run: cargo audit 2>&1 | tee ../rust-audit-report.txt || true

      - name: Combine audit reports
        run: |
          echo "# Weekly Dependency Audit Report" > audit-report.txt
          echo "" >> audit-report.txt
          echo "## Backend (pnpm audit)" >> audit-report.txt
          cat backend-audit-report.txt >> audit-report.txt
          echo "" >> audit-report.txt
          echo "## Rust Contracts (cargo audit)" >> audit-report.txt
          cat rust-audit-report.txt >> audit-report.txt

      - name: Send audit report to admin
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_SMTP_HOST }}
          server_port: ${{ secrets.EMAIL_SMTP_PORT }}
          username: ${{ secrets.EMAIL_SMTP_USER }}
          password: ${{ secrets.EMAIL_SMTP_PASS }}
          subject: 'Weekly Dependency Audit Report'
          body_file: audit-report.txt
          to: ${{ secrets.EMAIL_ADMIN }}
          from: ${{ secrets.EMAIL_FROM != '' && secrets.EMAIL_FROM || secrets.EMAIL_SMTP_USER }}
          secure: ${{ secrets.EMAIL_SMTP_SECURE }}

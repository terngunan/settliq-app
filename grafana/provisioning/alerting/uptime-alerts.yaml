apiVersion: 1

# Uptime alert rules for Settliq services.
# Runbook: https://github.com/terngunan/settliq-app/blob/main/monitoring/README.md

groups:
  - orgId: 1
    name: uptime
    folder: Settliq
    interval: 1m
    rules:
      - uid: uptime-api-down
        title: API Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: up{job="settliq-api"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: lt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Settliq API is down"
          description: "The Settliq API has been unreachable for more than 5 minutes."
          runbook_url: "https://github.com/terngunan/settliq-app/blob/main/monitoring/README.md"
        labels:
          severity: critical
          service: api


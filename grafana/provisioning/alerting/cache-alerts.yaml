apiVersion: 1

groups:
  - orgId: 1
    name: Settliq Cache Performance Alerts
    folder: Settliq
    interval: 1m
    rules:

      # Cache hit rate < 80% → alert team
      - uid: cache_hit_rate_low
        title: Cache Hit Rate Low (< 80%)
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: |
                rate(cache_hits_total[5m])
                / (rate(cache_hits_total[5m]) + rate(cache_misses_total[5m]) + 0.0001)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.8
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
              refId: C
              type: classic_conditions
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Cache hit rate dropped below 80% over the last 5 minutes
          description: 'Cache hit rate: {{ $values.A.Value | humanizePercentage }}'
        labels:
          severity: warning
          team: platform
